name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Go tests
        run: go test ./cmd/... ./internal/... ./examples/...
      - name: Frontend tests
        working-directory: frontend
        run: |
          npm ci
          npm test

  publish:
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      attestations: write
      id-token: write
    env:
      IMAGE: ghcr.io/alphabravo-oss/webhookie
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: ver
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.1.0-dev" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ steps.ver.outputs.version }},enable=${{ github.ref_type == 'tag' }}
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=webhookie
            org.opencontainers.image.description=Mailpit analog for webhooks
            org.opencontainers.image.source=https://github.com/alphabravo-oss/webhookie
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Make GHCR package public
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/orgs/alphabravo-oss/packages/container/webhookie/visibility" \
            -f visibility=public

      - name: GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            Alpha **${{ steps.ver.outputs.version }}**. Experimental. Use at your own risk.

            ```bash
            docker pull ghcr.io/alphabravo-oss/webhookie:${{ steps.ver.outputs.version }}
            docker run --rm -p 8080:8080 \
              -e WEBHOOKIE_PUBLIC_BASE_URL=http://localhost:8080 \
              -v webhookie-data:/data \
              ghcr.io/alphabravo-oss/webhookie:${{ steps.ver.outputs.version }}
            ```
